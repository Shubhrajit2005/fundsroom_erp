openapi: 3.1.0
info:
  title: forgeflow Operations API
  version: 1.0.0
  description: Enquiry-to-dispatch workflow API. All routes are under /api.
servers:
  - url: http://localhost:4000/api
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      security: []
      summary: Authenticate and receive an expiring JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: JWT and user profile }
        "401": { description: Invalid credentials }
  /me:
    get:
      summary: Current authenticated user
      responses:
        "200": { description: User profile }
        "401": { description: Missing or invalid token }
  /products:
    get:
      summary: Product master and live inventory availability
      responses:
        "200": { description: Product and stock rows }
  /inventory/{productId}:
    patch:
      summary: Adjust physical inventory
      description: Admin only. Rejects quantities below already reserved stock.
      parameters:
        - {
            in: path,
            name: productId,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [physicalQuantity]
              properties:
                physicalQuantity: { type: integer, minimum: 0 }
      responses:
        "200": { description: Updated physical, reserved, and available values }
        "403": { description: Admin role required }
        "409": { description: Would undercut reserved stock }
  /customers:
    get:
      summary: List saved customers for enquiry selection
      responses:
        "200": { description: Customer master list }
    post:
      summary: Add a customer to the customer master
      description: Sales role only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyName, contactPerson, mobile, email, city]
              properties:
                companyName: { type: string, maxLength: 200 }
                contactPerson: { type: string, maxLength: 120 }
                mobile: { type: string, maxLength: 40 }
                email: { type: string, format: email, maxLength: 254 }
                city: { type: string, maxLength: 120 }
      responses:
        "201": { description: Saved customer }
        "400": { description: Validation failure }
  /enquiries:
    get:
      summary: List enquiries and customer summary
      responses:
        "200": { description: Enquiry list }
    post:
      summary: Create customer, enquiry, and product lines
      description: Sales role only. Reference a saved customerId or provide customer details; exactly one is required. Customer/enquiry writes commit together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                customerId: { type: string, format: uuid }
                customer:
                  type: object
                  required: [companyName, contactPerson, mobile, email, city]
                  properties:
                    companyName: { type: string }
                    contactPerson: { type: string }
                    mobile: { type: string }
                    email: { type: string, format: email }
                    city: { type: string }
                enquiryDate: { type: string, format: date }
                requiredDate: { type: string, format: date }
                notes: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
      responses:
        "201": { description: Created enquiry }
        "400": { description: Validation failure }
  /enquiries/{id}:
    get:
      summary: Read enquiry and customer details
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Enquiry and customer fields }
        "404": { description: Enquiry not found }
  /enquiries/{id}/items:
    get:
      summary: List product lines for an enquiry
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Enquiry products }
  /quotations:
    get:
      summary: List quotations and customer summary
      responses:
        "200": { description: Quotation list }
    post:
      summary: Create a quotation against an enquiry
      description: Sales role only. Server validates lines and computes all totals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enquiryId, validUntil, items]
              properties:
                enquiryId: { type: string, format: uuid }
                validUntil: { type: string, format: date }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity, unitPrice]
                    properties:
                      productId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
                      unitPrice: { type: number, minimum: 0 }
                      discountPct:
                        { type: number, minimum: 0, maximum: 100, default: 0 }
                      gstPct:
                        { type: number, minimum: 0, maximum: 100, default: 18 }
      responses:
        "201": { description: Created quotation with calculated totals }
        "400": { description: Invalid line, enquiry, or date }
  /quotations/{id}/status:
    patch:
      summary: Move a quotation through its allowed status transitions
      description: Sales may submit a DRAFT quotation by changing it to SENT. Admin alone may accept or reject a SENT quotation. Sales alone may convert an accepted quotation into an order.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [SENT, ACCEPTED, REJECTED], description: SALES may set SENT from DRAFT; ADMIN may set ACCEPTED or REJECTED from SENT. }
      responses:
        "200": { description: Updated quotation }
        "400": { description: Invalid transition }
        "403": { description: Role cannot perform this transition }
  /quotations/{id}/convert:
    post:
      summary: Convert an accepted quotation into one sales order
      description: Sales role only. DB unique constraint prevents duplicate conversion.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "201": { description: Created pending sales order }
        "400": { description: Quotation is not accepted }
        "409": { description: Quotation already converted }
  /sales-orders:
    get:
      summary: List sales orders with dispatch summary
      responses:
        "200": { description: Sales order list }
  /sales-orders/{id}:
    get:
      summary: Sales order and product details with current stock
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Sales order detail }
  /sales-orders/{id}/confirm:
    post:
      summary: Confirm pending order and reserve all product quantities
      description: Admin only. Locks order and inventory rows and rolls back on any shortage.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: Confirmed order }
        "403": { description: Admin role required }
        "409": { description: Order state or available stock conflict }
  /sales-orders/{id}/dispatch:
    post:
      summary: Dispatch confirmed order and consume physical and reserved quantities
      description: Admin only. One dispatch per order; dispatch and stock updates are atomic.
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleNumber, driverName]
              properties:
                vehicleNumber: { type: string, maxLength: 40 }
                driverName: { type: string, maxLength: 120 }
      responses:
        "201": { description: Created dispatch and dispatched order }
        "403": { description: Admin role required }
        "409": { description: Invalid order state or reservation }
  /dashboard:
    get:
      summary: Dashboard counts, latest orders, and lowest available stock
      responses:
        "200": { description: Dashboard summary }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
